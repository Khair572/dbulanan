<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Data Bulanan Santri</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.png">
    <meta name="theme-color" content="#0E5C52">
    <script src="../theme.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
        .font-display { font-family: 'Fraunces', Georgia, serif; }
        .brand-panel {
            background: linear-gradient(155deg, #12695F 0%, #0A3D38 100%);
        }
        .brand-panel::before{
            content:"";
            position:absolute; inset:0;
            background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.10) 1px, transparent 0);
            background-size: 20px 20px;
            opacity:.5;
        }
        @media (max-width:359px){ .responsive-login-panel{padding:1.25rem!important} }
    </style>
</head>
<body class="bg-[#F5F7F6] font-sans">

    <button type="button" data-theme-toggle aria-label="Ganti ke Mode Malam" title="Ganti ke Mode Malam" class="fixed top-4 right-4 z-20 inline-flex items-center justify-center w-10 h-10 rounded-full bg-white text-slate-600 shadow-md ring-1 ring-slate-900/5 hover:text-[#0E5C52] active:scale-95 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="theme-icon-moon w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg xmlns="http://www.w3.org/2000/svg" class="theme-icon-sun w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    </button>

    <div class="min-h-screen flex items-center justify-center p-4 sm:p-6">
        <div class="w-full max-w-3xl bg-white rounded-3xl shadow-xl overflow-hidden grid md:grid-cols-2">
<div class="brand-panel relative hidden md:flex flex-col justify-between p-8 text-white">
                <img src="icon.png" alt="" class="w-14 h-14 rounded-2xl shadow-md relative">
                <div class="relative">
                    <h2 class="font-display text-2xl font-semibold leading-snug">YPP<br>DQH</h2>
                    <p class="text-sm text-white/70 mt-3 max-w-xs">DARUL QUR'AN WAL HADIST &mdash; AL-IDRISY</p>
                </div>
                <p class="text-xs text-white/50 relative">Khusus untuk admin yang berwenang.</p>
            </div>
<div class="responsive-login-panel p-7 sm:p-10 flex flex-col justify-center">
                <img src="icon.png" alt="" class="w-11 h-11 rounded-xl shadow-sm mb-5 md:hidden">
                <h1 class="font-display text-2xl font-semibold text-[#0B4A43] mb-1">Masuk Admin</h1>
                <p class="text-sm text-slate-500 mb-6">Masuk untuk mengelola data bulanan santri.</p>

                <form id="loginForm" class="space-y-4">
                    <div>
                        <label class="block text-slate-700 font-medium mb-1 text-sm">Email</label>
                        <input type="email" id="email" required autocomplete="username"
                            class="w-full border border-slate-200 bg-slate-50 rounded-xl px-3.5 py-2.5 focus:bg-white focus:ring-2 focus:ring-[#12695F] focus:border-[#12695F] outline-none transition" placeholder="admin@contoh.com">
                    </div>
                    <div>
                        <label class="block text-slate-700 font-medium mb-1 text-sm">Kata Sandi</label>
                        <div class="relative">
                            <input type="password" id="password" required autocomplete="current-password"
                                class="w-full border border-slate-200 bg-slate-50 rounded-xl pl-3.5 pr-11 py-2.5 focus:bg-white focus:ring-2 focus:ring-[#12695F] focus:border-[#12695F] outline-none transition" placeholder="••••••••">
                            <button type="button" id="togglePassword" aria-label="Tampilkan kata sandi" title="Tampilkan kata sandi" aria-pressed="false" aria-controls="password"
                                class="absolute inset-y-0 right-0 w-11 flex items-center justify-center text-slate-400 hover:text-slate-600 transition rounded-r-xl">
<svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
<svg id="eyeClosed" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                            </button>
                        </div>
                    </div>
                    <p id="errorMsg" class="text-sm text-rose-600 hidden"></p>
                    <button type="submit" id="loginBtn"
                        class="w-full bg-[#0E5C52] text-white font-semibold py-2.5 rounded-xl shadow-sm hover:shadow-md hover:bg-[#0B4A43] active:scale-[0.99] transition-all">Masuk</button>
                </form>

                <p class="text-center text-xs text-slate-400 mt-6">
                    <a href="../index.html" class="hover:text-[#0E5C52] transition">Kembali ke halaman data</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://jjwqwgmjoiiszczinshq.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Tg7JS75now_Q9SKYrP6AsQ_oG-lHbPm';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        _supabase.auth.getSession().then(({ data: { session } }) => {
            if (session) window.location.href = 'admin.html';
        });

        (function () {
            const input = document.getElementById('password');
            const btn = document.getElementById('togglePassword');
            const eyeOpen = document.getElementById('eyeOpen');
            const eyeClosed = document.getElementById('eyeClosed');

            btn.addEventListener('click', function () {
                const show = input.type === 'password';
                const start = input.selectionStart;
                const end = input.selectionEnd;

                input.type = show ? 'text' : 'password';
                eyeOpen.classList.toggle('hidden', show);
                eyeClosed.classList.toggle('hidden', !show);

                const label = show ? 'Sembunyikan kata sandi' : 'Tampilkan kata sandi';
                btn.setAttribute('aria-label', label);
                btn.setAttribute('title', label);
                btn.setAttribute('aria-pressed', show ? 'true' : 'false');

                input.focus();
                try { input.setSelectionRange(start, end); } catch (e) {}
            });
        })();

        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.classList.add('hidden');
            btn.disabled = true;
            btn.textContent = 'Memproses...';

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { error } = await _supabase.auth.signInWithPassword({ email, password });

            if (error) {
                errorMsg.textContent = 'Login gagal: ' + error.message;
                errorMsg.classList.remove('hidden');
                btn.disabled = false;
                btn.textContent = 'Masuk';
            } else {
                window.location.href = 'admin.html';
            }
        });
    </script>
</body>
</html>
